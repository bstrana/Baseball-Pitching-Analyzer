user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Cloudron mounts the container filesystem read-only outside a few
    # specific paths; nginx's default temp dirs live under /var/cache/nginx,
    # which isn't writable there. Redirect them all to /tmp instead.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;

    server {
        listen 8000 default_server;
        server_name _;
        root /app/code/dist;
        index index.html;

        # Pose detection needs camera access; make sure it isn't blocked by a
        # restrictive default Permissions-Policy from an upstream proxy.
        add_header Permissions-Policy "camera=(self)" always;

        # tfjs model/wasm assets and hashed build assets are safe to cache hard.
        location ~* \.(?:js|css|wasm|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /health {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok";
        }

        # Generated at container startup from /app/data/config.env (see
        # cloudron/start.sh) - served from the writable data dir, not the
        # read-only image layer, and never cached since it can change
        # across restarts.
        location = /env-config.js {
            alias /app/data/env-config.js;
            add_header Cache-Control "no-store" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
