user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;

    server {
        listen 8000 default_server;
        server_name _;
        root /app/code/dist;
        index index.html;

        # Pose detection needs camera access; make sure it isn't blocked by a
        # restrictive default Permissions-Policy from an upstream proxy.
        add_header Permissions-Policy "camera=(self)" always;

        # tfjs model/wasm assets and hashed build assets are safe to cache hard.
        location ~* \.(?:js|css|wasm|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /health {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
