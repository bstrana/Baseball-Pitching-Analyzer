<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseball Mechanics Analyzer</title>
  </head>
  <body>
    <div id="root">
      <!-- Static YBC splash shown while the JS bundle parses and Keycloak
           initializes - main.tsx's renderApp() replaces this the moment
           the app is ready. Kept in sync with src/components/SplashScreen.tsx. -->
      <div class="fixed inset-0 flex flex-col items-center justify-center gap-5 bg-white">
        <img src="/ybc-logo.svg" width="88" height="88" alt="YBC logo" />
        <div class="text-center">
          <p class="text-sm font-bold text-slate-900 uppercase tracking-[0.2em]">Your Ball Club</p>
          <p class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">Loading...</p>
        </div>
        <div class="ybc-loading-line w-36 h-1 rounded-full bg-slate-200"></div>
      </div>
    </div>
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
