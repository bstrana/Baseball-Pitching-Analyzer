<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseball Mechanics Analyzer</title>
  </head>
  <body>
    <div id="root">
      <!-- Static YBC splash shown while the JS bundle parses and Keycloak
           initializes - main.tsx's renderApp() replaces this the moment
           the app is ready. Kept in sync with src/components/SplashScreen.tsx. -->
      <div class="fixed inset-0 flex flex-col items-center justify-center gap-5 bg-slate-950">
        <div class="relative">
          <svg width="88" height="88" viewBox="0 0 200 200" role="img" aria-label="YBC logo">
            <polygon points="30,24 170,24 170,100 100,176 30,100" fill="#ffffff" stroke="#dd6b26" stroke-width="7" stroke-linejoin="round" />
            <text x="102" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="68" letter-spacing="-2" fill="#2b1810">YBC</text>
            <text x="99" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="68" letter-spacing="-2" fill="#dd6b26" stroke="#2b1810" stroke-width="2.5" paint-order="stroke fill">YBC</text>
          </svg>
          <div class="absolute -inset-2 rounded-full border-2 border-orange-500/30 border-t-orange-400 animate-spin"></div>
        </div>
        <div class="text-center">
          <p class="text-sm font-bold text-white uppercase tracking-[0.2em]">Your Ball Club</p>
          <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1">Loading...</p>
        </div>
      </div>
    </div>
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
